<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bulls & Cows Word</title>

<style>
body{
background:#121213;
color:white;
font-family:Arial;
text-align:center;
}

#wrap{
display:flex;
justify-content:center;
gap:20px;
margin-top:20px;
}

#grid{
display:grid;
grid-template-columns:repeat(6,60px);
gap:5px;
}

.tile{
width:60px;
height:60px;
border:2px solid #3a3a3c;
font-size:28px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.result{
height:60px;
display:flex;
align-items:center;
font-size:18px;
}

.key{
display:inline-block;
background:#818384;
margin:3px;
padding:10px 12px;
border-radius:4px;
cursor:pointer;
font-weight:bold;
}

#msg{margin-top:15px;font-size:18px}
</style>
</head>
<body>

<h1>Bulls & Cows</h1>
<p>Guess the word. Results show counts only.</p>

<div id="wrap">
<div id="grid"></div>
<div id="results"></div>
</div>

<div id="kb"></div>
<div id="msg"></div>

<script>
let words=[];
let secret="";
let row=0,col=0;
let current="";
let maxRows=20;
let grid=[];
let filters={}; // letter -> state

/* load words */
fetch("bnc 6-letter 23033.txt")
.then(r=>r.text())
.then(t=>{
words=t.split(/\r?\n/).map(w=>w.trim()).filter(Boolean);
start();
});

function dailyIndex(){
let start=new Date(2024,0,1);
let now=new Date();
return Math.floor((now-start)/86400000)%words.length;
}

function start(){
secret=words[dailyIndex()];
makeGrid();
makeKeyboard();
}

/* grid */
function makeGrid(){
let g=document.getElementById("grid");
let r=document.getElementById("results");
g.innerHTML="";
r.innerHTML="";
for(let y=0;y<maxRows;y++){
grid[y]=[];
for(let x=0;x<6;x++){
let d=document.createElement("div");
d.className="tile";
d.onclick=()=>cycleLetter(d.textContent);
g.appendChild(d);
grid[y][x]=d;
}
let res=document.createElement("div");
res.className="result";
res.id="res"+y;
r.appendChild(res);
}
}

/* keyboard */
function makeKeyboard(){
let letters="QWERTYUIOPASDFGHJKLZXCVBNM";
let kb=document.getElementById("kb");

for(let l of letters){
let k=document.createElement("span");
k.className="key";
k.textContent=l;
k.onclick=()=>type(l);
kb.appendChild(k);
}

addKey("ENTER",submit);
addKey("⌫",back);
}

function addKey(t,fn){
let k=document.createElement("span");
k.className="key";
k.textContent=t;
k.onclick=fn;
document.getElementById("kb").appendChild(k);
}

/* typing */
function type(l){
if(col<6){
grid[row][col].textContent=l;
applyFilter(grid[row][col]);
current+=l;
col++;
}
}

function back(){
if(col>0){
col--;
grid[row][col].textContent="";
current=current.slice(0,-1);
}
}

/* submit guess */
function submit(){
if(current.length!=6){msg("Need 6 letters");return;}
if(!words.includes(current)){msg("Not in list");return;}

let res=countGY(current);
document.getElementById("res"+row).textContent=
`🟩 ${res.g}  🟨 ${res.y}`;

row++;
col=0;
current="";

if(res.g==6){msg("Correct!");return;}
if(row>=maxRows){msg("Word was "+secret);}
}

/* count greens/yellows */
function countGY(guess){
let g=0,y=0;
let s=secret.split("");
let w=guess.split("");
let rs=[],rw=[];

for(let i=0;i<6;i++){
if(s[i]==w[i]) g++;
else{rs.push(s[i]); rw.push(w[i]);}
}

for(let c of rw){
let i=rs.indexOf(c);
if(i!=-1){y++; rs.splice(i,1);}
}
return {g,y};
}

/* FILTER SYSTEM */

function cycleLetter(letter){
if(!letter) return;

let state=(filters[letter]??0)+1;
if(state>3) state=0;
filters[letter]=state;
recolorAll(letter);
}

function recolorAll(letter){
for(let r of grid){
for(let t of r){
if(t.textContent===letter)
applyFilter(t);
}
}
}

function applyFilter(tile){
let l=tile.textContent;
if(!l) return;

let s=filters[l]??0;
let colors=[
"",
"#3a3a3c",
"#b59f3b",
"#538d4e"
];
tile.style.background=colors[s];
}

/* keyboard typing */
document.addEventListener("keydown",e=>{
if(/^[a-z]$/i.test(e.key)) type(e.key.toUpperCase());
if(e.key==="Backspace") back();
if(e.key==="Enter") submit();
});

function msg(t){document.getElementById("msg").textContent=t;}
</script>

</body>
</html>
