<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Word Grid</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#121213;
color:white;
}

#grid{
display:grid;
grid-template-columns:repeat(6,60px);
gap:5px;
justify-content:center;
margin:20px;
}

.tile{
width:60px;
height:60px;
border:2px solid #3a3a3c;
font-size:28px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
user-select:none;
}

.rowDone .tile{border-color:#565758;}

.keyboard{
margin-top:20px;
}

.key{
display:inline-block;
padding:10px 12px;
margin:3px;
background:#818384;
border-radius:4px;
cursor:pointer;
font-weight:bold;
}

#msg{margin-top:15px;font-size:18px;}
</style>
</head>
<body>

<h1>Daily Word</h1>
<p>Click tiles to mark colors manually.</p>

<div id="grid"></div>
<div id="msg"></div>

<div class="keyboard" id="kb"></div>

<script>
let words=[];
let secret="";
let row=0;
let col=0;
let maxRows=20;
let grid=[];
let current="";

/* load word list */
fetch("bnc 6-letter 23033.txt")
.then(r=>r.text())
.then(t=>{
words=t.split(/\r?\n/).map(w=>w.trim()).filter(Boolean);
start();
});

function dailyIndex(){
let start=new Date(2024,0,1);
let now=new Date();
return Math.floor((now-start)/86400000)%words.length;
}

function start(){
secret=words[dailyIndex()];
createGrid();
createKeyboard();
}

/* grid */
function createGrid(){
let g=document.getElementById("grid");
g.innerHTML="";
for(let r=0;r<maxRows;r++){
grid[r]=[];
for(let c=0;c<6;c++){
let d=document.createElement("div");
d.className="tile";
d.dataset.state=0;
d.onclick=()=>cycle(d);
g.appendChild(d);
grid[r][c]=d;
}
}
}

function cycle(tile){
let s=(+tile.dataset.state+1)%4;
tile.dataset.state=s;
let colors=["#121213","#3a3a3c","#b59f3b","#538d4e"];
tile.style.background=colors[s];
}

/* keyboard */
function createKeyboard(){
let letters="QWERTYUIOPASDFGHJKLZXCVBNM";
let kb=document.getElementById("kb");

for(let l of letters){
let k=document.createElement("span");
k.textContent=l;
k.className="key";
k.onclick=()=>type(l);
kb.appendChild(k);
}

let enter=document.createElement("span");
enter.textContent="ENTER";
enter.className="key";
enter.onclick=submit;
kb.appendChild(enter);

let del=document.createElement("span");
del.textContent="⌫";
del.className="key";
del.onclick=back;
kb.appendChild(del);
}

function type(l){
if(col<6){
grid[row][col].textContent=l;
current+=l;
col++;
}
}

function back(){
if(col>0){
col--;
grid[row][col].textContent="";
current=current.slice(0,-1);
}
}

function submit(){
if(current.length!=6){
msg("Need 6 letters");
return;
}
if(!words.includes(current)){
msg("Not in word list");
return;
}

if(current===secret){
msg("Correct word!");
return;
}

row++;
col=0;
current="";

if(row>=maxRows){
msg("Out of guesses. Word was "+secret);
}
}

function msg(t){
document.getElementById("msg").textContent=t;
}

/* keyboard typing */
document.addEventListener("keydown",e=>{
if(/^[a-z]$/i.test(e.key)) type(e.key.toUpperCase());
if(e.key==="Backspace") back();
if(e.key==="Enter") submit();
});
</script>

</body>
</html>
